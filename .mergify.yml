commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

queue_rules:
  - name: vm3-ff-review-freshness-v2
    merge_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = vm3-ff-review-hold-v2
    merge_method: fast-forward
    batch_size: 1

merge_queue:
  mode: serial
  max_parallel_checks: 1

pull_request_rules:
  - name: vm3-signature-chain-external-fork
    conditions:
      - number = 75
      - author = livastic-vm3-secondary-20260911
      - label = vm3-signature-chain-trigger
    actions:
      merge:
        method: merge

  - name: vm3-dismiss-review-preserve-change-request
    conditions:
      - head = vm3-dismiss-review-preserve
      - author = livastic-vm3-primary-20260911
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize

  - name: vm3 workflow_run visible external protected auto merge 260927
    conditions:
      - base = vm3-wfr-protected-base-260927
      - title = VM3 WFR VISIBLE EXTERNAL PROTECTED MERGE 260927
      - check-success = vm3-wfr-protected-gate
    actions:
      merge:
        method: merge

  - name: vm3 review author comment control 260928
    conditions:
      - number = 76
      - title = Add VM3 dismiss-review preserve canary v1
    actions:
      review:
        type: COMMENT
        message: VM3_REVIEW_AUTHOR_COMMENT_CONTROL_260928
        bot_account: "{{ author }}"
