commands_restrictions:
  queue:
    conditions:
      - sender = livastic-vm3-primary-20260911

queue_rules:
  - name: vm3-ff-review-freshness-v2
    merge_conditions:
      - "#approved-reviews-by >= 1"
      - check-success = vm3-ff-review-hold-v2
    merge_method: fast-forward
    batch_size: 1

merge_queue:
  mode: serial
  max_parallel_checks: 1

pull_request_rules:
  - name: vm3-signature-chain-external-fork
    conditions:
      - number = 75
      - author = livastic-vm3-secondary-20260911
      - label = vm3-signature-chain-trigger
    actions:
      merge:
        method: merge

  - name: vm3-dismiss-review-preserve-change-request
    conditions:
      - head = vm3-dismiss-review-preserve
      - author = livastic-vm3-primary-20260911
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize

  - name: vm3 workflow_run visible external protected auto merge 260927
    conditions:
      - base = vm3-wfr-protected-base-260927
      - title = VM3 WFR VISIBLE EXTERNAL PROTECTED MERGE 260927
      - check-success = vm3-wfr-protected-gate
    actions:
      merge:
        method: merge

  - name: vm3 review author self approval treatment clean 260928
    conditions:
      - number = 19
      - title = Change dispatch marker only in PR head
    actions:
      review:
        type: APPROVE
        message: VM3_REVIEW_AUTHOR_SELF_APPROVAL_CLEAN_TREATMENT_260928
        bot_account: "{{ author }}"

  - name: vm3 review explicit primary approve positive control 260928
    conditions:
      - number = 17
      - title = Required reviewer username-reuse impact
    actions:
      review:
        type: APPROVE
        message: VM3_REVIEW_EXPLICIT_PRIMARY_APPROVE_CONTROL_260928
        bot_account: livastic-vm3-primary-tmp-260920

  - name: vm3 last-push approval current 261008
    conditions:
      - base = vm3-lastpush-approval-261008
      - author = livastic-vm3-secondary-20260911
      - title = VM3 LASTPUSH TRIGGER 261008
    actions:
      merge:
        method: squash
