name: VM3 WFR Protected Source 260927
on:
  pull_request:
    branches: [vm3-wfr-protected-base-260927]
permissions:
  contents: read
jobs:
  source-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload non-executable candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: vm3-wfr-candidate-${{ github.event.pull_request.head.sha }}
          path: vm3-wfr-candidate.json
          if-no-files-found: error
      - name: Trusted source policy control
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_EVENT=$GITHUB_EVENT_NAME"
          echo "SOURCE_HEAD=$GITHUB_HEAD_REF"
          echo "SOURCE_BASE=$GITHUB_BASE_REF"
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("vm3-wfr-candidate.json","utf8")); if(c.safe!==true){console.error("deterministic unsafe candidate"); process.exit(1)}'
